# Project settings. Edit this file to change which markets you research.

[crypto]
# Any exchange CCXT supports with public OHLCV data. MEXC is reachable from this
# PC's network and has hourly history from 2022. (Colab uses "binanceus" instead.)
# Keep one exchange per data file: switching mixes prices and volumes.
exchange = "mexc"
# Add altcoins freely, e.g. "XRP/USDT", "ADA/USDT", "AVAX/USDT".
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT"]
timeframe = "1h"
start = "2022-01-01"

[portfolio]
# Coins for the multi-coin trend/momentum strategies (daily candles, weekly rebalance).
# The first three are the original research coins; the other ten were never used
# to choose any setting.
symbols = ["BTC/USDT", "ETH/USDT", "SOL/USDT",
           "XRP/USDT", "ADA/USDT", "DOGE/USDT", "AVAX/USDT", "LINK/USDT",
           "DOT/USDT", "LTC/USDT", "BNB/USDT", "TRX/USDT", "ATOM/USDT"]
original = ["BTC/USDT", "ETH/USDT", "SOL/USDT"]

[trend_paper]
# Forward paper test of the trend strategy above (fixed 2026-10-30, before any forward data).
# First decision at this Sunday's close (UTC), first trade at Monday's open.
start = "2026-11-01"
initial_cash = 10000
exchange = "mexc"

[memecoins]
# New-token scanner (paper only). GeckoTerminal network ids.
networks = ["solana", "base", "bsc", "eth"]
pages = 1                       # pages of new pools and of trending pools per network, per scan
# Safety checks, shared by every strategy
max_tax = 0.05                  # buy/sell/transfer tax
max_top10_share = 0.30          # 10 biggest ordinary wallets (EVM chains)
min_lp_locked = 0.90            # share of liquidity locked or burned
# Comparison group: a random sample of ALL listed pools, whatever the rules say
control_rate = 0.2
control_min_liquidity_usd = 1000
control_liquid_usd = 20000      # "equally liquid" comparison = control pools with at least this much
# Quick-exit rule tested on every strategy: sell at the first check (5m/15m/30m/1h)
# at or above +take_profit or at or below -stop_loss, otherwise sell at 1 hour.
quick_exit_take_profit = 0.30
quick_exit_stop_loss = 0.20
# Paper-trade cost model
trade_usd = 100
dex_fee = 0.003                 # per swap
gas_usd = { solana = 0.01, base = 0.05, bsc = 0.10, eth = 3.0 }   # per swap

# Entry strategies (fixed 2026-10-30, before seeing any of their results).
# Each is an independent paper trader with its own entry time and price.
[memecoins.strategies.trending]  # the week-1 rules
min_age_minutes = 15
max_age_hours = 24
min_liquidity_usd = 20000
min_trades_h1 = 50              # buys + sells in the last hour

[memecoins.strategies.early]     # before most of the hype
min_age_minutes = 15
max_age_hours = 1
min_liquidity_usd = 10000
min_trades_h1 = 30

[memecoins.strategies.not_pumped]  # trending, but not after a big run-up
min_age_minutes = 15
max_age_hours = 24
min_liquidity_usd = 20000
min_trades_h1 = 50
max_change_h1 = 0.50            # price rose less than 50% in the last hour

[memecoins.strategies.bsc_momentum]  # fixed 2026-11-03 from the rule lab, BEFORE its forward test
# Lab result (scanner v2 data, Oct 30 - Nov 2): +6.5% design / +10.9% test per trade, entry at the
# next minute's open, sold after 5 minutes. Only a lead: many of those tokens were unknown to the
# honeypot checker. Verdict: `python -m trading_agent.memelab forward`, after 100+ trades.
networks = ["bsc"]
judge_once = true               # judged only when first seen, as in the lab
security = "basic"              # known to GoPlus, not a honeypot, taxes known and <= max_tax
max_tax = 0.10
min_age_minutes = 0
max_age_hours = 100000          # any age
min_liquidity_usd = 5000
min_trades_h1 = 1
min_buy_share = 0.5             # at least half of last hour's trades were buys
forward_start = "2026-11-03T21:00:00+00:00"
forward_stop_loss = 0.10        # replayed on 1-minute candles
forward_hold_minutes = 5

[funding]
# Market-wide sentiment from perpetual-futures funding rates (public data).
# Deribit has hourly history from 2022 for BTC and ETH; used as inputs for every coin.
exchange = "deribit"
symbols = ["BTC/USD:BTC", "ETH/USD:ETH"]
start = "2022-01-01"

[forex]
# Forex data is imported from CSV files you download from a legitimate
# historical-data provider (see README). Names have no slash.
symbols = ["EURUSD", "GBPUSD", "USDJPY"]
timeframe = "1h"

# Trading costs as fractions of price (0.001 = 0.1%). Be pessimistic: if a
# strategy only works with tiny costs, it does not work.
[costs.crypto]
fee_rate = 0.001    # typical spot taker fee
spread = 0.0002
slippage = 0.0005

[costs.forex]
fee_rate = 0.0      # forex brokers usually charge through the spread instead
spread = 0.0001     # about 1 pip on EUR/USD
slippage = 0.00005

[risk]
position_fraction = 0.5     # use half the account per trade
stop_loss = 0.03            # exit if price moves 3% against the position
take_profit = 0.0           # 0 = no take-profit
max_drawdown_halt = 0.3     # stop trading after a 30% fall from the peak

[model]
horizon = 1                 # predict the next candle
threshold = 0.55            # only trade when the model is at least 55% confident
test_fraction = 0.3         # last 30% of history is kept unseen for evaluation
allow_short = false         # set true to also bet on falling prices

# Paper trading: one virtual account shared by all symbols. Zero = rule off.
[paper]
initial_cash = 10000
position_fraction = 0.25    # each new position uses 25% of equity
max_open_positions = 3
max_gross_exposure = 1.0    # total position value may not exceed equity (no leverage)
stop_loss = 0.03
take_profit = 0.0
daily_loss_limit = 0.03     # lose 3% in a UTC day -> close everything, pause until tomorrow
max_drawdown_halt = 0.3     # 30% below the peak -> close everything and stop
